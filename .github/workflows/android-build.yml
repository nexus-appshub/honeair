name: Fast Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: nnn

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false
        gradle-home-cache-cleanup: true

    - name: Ensure gradlew executable
      run: chmod +x ./gradlew

    - name: Decode Keystore
      if: env.RELEASE_STORE_PASSWORD != ''
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks || true
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

    - name: Fast Build Release APK
      run: |
        ./gradlew assembleRelease \
          --no-daemon \
          --parallel \
          --build-cache \
          -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC" \
          -x test \
          -x lint \
          -x lintVitalRelease
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Package Release ZIP
      run: |
        mkdir -p build_output
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" build_output/HomeAirTV-v4.6.7-release.apk
          cd build_output
          zip HomeAirTV-v4.6.7-release.zip HomeAirTV-v4.6.7-release.apk
          cd ..
        fi
        ls -lh build_output/

    - name: Generate Direct Download Links
      run: |
        APK_FILE="build_output/HomeAirTV-v4.6.7-release.apk"
        ZIP_FILE="build_output/HomeAirTV-v4.6.7-release.zip"
        echo "=== UPLOADING APK & ZIP FOR DIRECT DOWNLOAD ==="
        
        # Upload APK and ZIP to tmpfiles.org
        TMP_APK_URL=$(curl -s --max-time 20 -F "file=@$APK_FILE" https://tmpfiles.org/api/v1/upload | grep -o 'https://tmpfiles.org/[0-9]*/[a-zA-Z0-9_.-]*' | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//' || true)
        TMP_ZIP_URL=$(curl -s --max-time 20 -F "file=@$ZIP_FILE" https://tmpfiles.org/api/v1/upload | grep -o 'https://tmpfiles.org/[0-9]*/[a-zA-Z0-9_.-]*' | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//' || true)
        
        # Upload to file.io
        FILEIO_URL=$(curl -s --max-time 20 -F "file=@$ZIP_FILE" https://file.io | grep -o 'https://file.io/[a-zA-Z0-9]*' || true)
        
        echo "================================================="
        echo "DIRECT APK DOWNLOAD (tmpfiles): $TMP_APK_URL"
        echo "DIRECT ZIP DOWNLOAD (tmpfiles): $TMP_ZIP_URL"
        echo "DIRECT ZIP DOWNLOAD (file.io):  $FILEIO_URL"
        echo "================================================="

    - name: Publish to GitHub Releases (Unlimited Permanent Storage)
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: "v4.6.7-build-${{ github.run_number }}"
        name: "Home Air TV Release v4.6.7 (Build #${{ github.run_number }})"
        body: |
          ### 🚀 Home Air TV v4.6.7 Release (Build #${{ github.run_number }})
          - **Package:** `com.homeairtv.xubilas`
          - **Artifacts:** Signed `.apk` and `.zip` release package.
        files: |
          build_output/HomeAirTV-v4.6.7-release.apk
          build_output/HomeAirTV-v4.6.7-release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Upload APK & ZIP Artifact (Actions Storage)
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: HomeAirTV-Release-Package
        path: build_output/*
        retention-days: 1
