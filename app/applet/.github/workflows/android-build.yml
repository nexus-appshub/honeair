name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: nnn
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false
        cache-read-only: false

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Decode Keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

    - name: Build Optimized Release APK
      run: ./gradlew assembleRelease --no-daemon --parallel
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p build_output
        APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
        cp "$APK_FILE" build_output/HomeAirTV-v4.6.7-release.apk
        ls -lh build_output/

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: "v4.6.7-build-${{ github.run_number }}"
        name: "Home Air TV Release v4.6.7 (Build #${{ github.run_number }})"
        body: |
          ### 🚀 Home Air TV v4.6.7 Release (Build #${{ github.run_number }})
          - **Package:** `com.homeairtv.xubilas`
          - **Artifact:** Signed `.apk` release file.
        files: |
          build_output/HomeAirTV-v4.6.7-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Upload APK Artifact (Actions Storage)
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: HomeAirTV-Release-APK
        path: build_output/*.apk
        retention-days: 1
